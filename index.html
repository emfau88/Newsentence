<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Neusatz · Geographischer 3D-Test</title>
<style>body{margin:0;background:#b8cfdf;font:14px system-ui;color:#edf1f5}canvas{display:block;width:100%;height:100%}aside{position:fixed;top:12px;left:12px;padding:14px;background:#17252bea;border-radius:12px;max-width:min(390px,calc(100vw - 52px))}h1{font-size:18px;margin:0 0 8px}select,button{background:#e7ecec;color:#15252a;border:0;border-radius:5px;padding:8px;margin:3px 1px;font:inherit}#status{font-size:12px;line-height:1.6;max-width:360px;margin-top:8px}footer{position:fixed;bottom:8px;left:10px;background:#17252bd9;padding:5px 9px;border-radius:5px;font-size:11px}label{display:block;margin-top:6px}@media(max-width:600px){aside{padding:10px}button{font-size:12px;padding:7px}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<aside><h1>Neusatz · 3D-Basis</h1><label>Detailstufe <select id="lod"><option value="0">LOD0 · Hero + Background</option><option value="1">LOD1 · 6×6 km Master</option><option value="2">LOD2 · leichtere Fernansicht</option></select></label><div><button data-camera="overview">Übersicht</button><button data-camera="approach">Cinematic-Anflug</button><button data-camera="village">Im Dorf</button><button data-camera="seam">Randprüfung</button></div><label><input type="checkbox" id="wire"> Gelände-Drahtgitter</label><div id="status">Daten werden geladen …</div></aside><footer>Datenquelle: LGL, www.lgl-bw.de, dl-de/by-2-0 · Bearbeitete Geodaten · Keine Dekoration</footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';import {OrbitControls} from './vendor/OrbitControls.js';
const status=document.querySelector('#status');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0xb8cfdf);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,1,16000);const controls=new OrbitControls(camera,renderer.domElement);controls.minDistance=3;controls.maxDistance=14000;controls.maxPolarAngle=Math.PI*.495;controls.enableDamping=false;
scene.add(new THREE.HemisphereLight(0xffffff,0x9aa4a8,2.1));const sun=new THREE.DirectionalLight(0xfff8ed,2.4);sun.position.set(-1000,1800,600);scene.add(sun);
const manifest=await fetch('./manifest.json').then(r=>r.json());const bounds=manifest.bounds_epsg25832;const rect=new THREE.Vector4(bounds[0]-462000,5407000-bounds[3],bounds[2]-462000,5407000-bounds[1]);const heroActive={value:0};const groups={0:new THREE.Group(),1:new THREE.Group(),2:new THREE.Group()};scene.add(groups[0],groups[1],groups[2]);groups[0].visible=false;groups[2].visible=false;const loaded={};const terrainMaterials=[];let mode=1;let ready=false;const loader=new GLTFLoader();
function draw(){renderer.render(scene,camera)} controls.addEventListener('change',draw);
function terrainMaterial(material,clip){const m=new THREE.MeshBasicMaterial({map:material.map,side:THREE.FrontSide});m.map.colorSpace=THREE.SRGBColorSpace;m.map.anisotropy=renderer.capabilities.getMaxAnisotropy();if(clip){m.onBeforeCompile=s=>{s.uniforms.heroActive=heroActive;s.uniforms.heroRect={value:rect};s.vertexShader='varying vec3 geoPosition;\n'+s.vertexShader;s.vertexShader=s.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\ngeoPosition=(modelMatrix * vec4(position,1.0)).xyz;');s.fragmentShader='uniform float heroActive;uniform vec4 heroRect;varying vec3 geoPosition;\n'+s.fragmentShader;s.fragmentShader=s.fragmentShader.replace('#include <clipping_planes_fragment>','#include <clipping_planes_fragment>\nif(heroActive>0.5 && geoPosition.x>=heroRect.x+0.05 && geoPosition.x<=heroRect.z-0.05 && geoPosition.z>=heroRect.y+0.05 && geoPosition.z<=heroRect.w) discard;');};m.customProgramCacheKey=()=> 'heroRectClip';}if(!clip){m.polygonOffset=true;m.polygonOffsetFactor=-2;m.polygonOffsetUnits=-2;}terrainMaterials.push(m);return m;}
function prepare(g,background=false){g.traverse(o=>{if(!o.isMesh)return;const isTerrain=!!o.material.map;if(isTerrain){o.material=terrainMaterial(o.material,background);o.name='terrain';}else{o.material.side=THREE.DoubleSide;o.material.roughness=1;o.material.metalness=0;}});return g;}
// Tiny perimeter skirts close raster cracks without changing the geodata or top elevations.
function addSkirts(g){const extra=[];g.traverse(o=>{if(!o.isMesh||!o.material.map)return;const a=o.geometry.attributes.position,u=o.geometry.attributes.uv;if(a.count!==250000)return;const edges=[Array.from({length:500},(_,i)=>i),Array.from({length:500},(_,i)=>i*500+499),Array.from({length:500},(_,i)=>249999-i),Array.from({length:500},(_,i)=>(499-i)*500)];const vs=[],uv=[],ix=[];for(const edge of edges){const start=vs.length/3;for(const i of edge){vs.push(a.getX(i),a.getY(i),a.getZ(i),a.getX(i),a.getY(i)-0.5,a.getZ(i));uv.push(u.getX(i),u.getY(i),u.getX(i),u.getY(i));}for(let i=0;i<499;i++){const j=start+i*2;ix.push(j,j+1,j+2,j+1,j+3,j+2);}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(vs,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(ix);const mat=new THREE.MeshBasicMaterial({map:o.material.map,side:THREE.DoubleSide});const skirt=new THREE.Mesh(geo,mat);skirt.name='Terrain_skirt_0.5m';extra.push(skirt);});extra.forEach(o=>g.add(o));return g;}
// Remove complete duplicate building surfaces at runtime; master file remains untouched.
function backgroundBuildingMask(g){g.traverse(o=>{if(!o.isMesh||o.material.map)return;const geo=o.geometry;const pos=geo.attributes.position;const idx=geo.index;const arr=idx?Array.from(idx.array):Array.from({length:pos.count},(_,i)=>i);const kept=[],inside=[];const bb=manifest.building_bounds.map(v=>{let [a,b]=v.bounds_utm_nhn;return[a[0]-462000,5407000-b[1],b[0]-462000,5407000-a[1]];});const edge=bb.filter(b=>b[0]<rect.x+30||b[2]>rect.z-30||b[1]<rect.y+30||b[3]>rect.w-30);
for(let i=0;i<arr.length;i+=3){const ids=arr.slice(i,i+3);let x=0,z=0;for(const j of ids){x+=pos.getX(j)/3;z+=pos.getZ(j)/3}let remove=x>rect.x&&x<rect.z&&z>rect.y&&z<rect.w;if(!remove)remove=edge.some(b=>x>=b[0]-.05&&x<=b[2]+.05&&z>=b[1]-.05&&z<=b[3]+.05);(remove?inside:kept).push(...ids)}o.userData.originalIndex=geo.index;o.userData.outsideIndex=new THREE.BufferAttribute(new Uint32Array(kept),1);});}
function maskBuildings(on){groups[1].traverse(o=>{if(o.isMesh&&o.userData.outsideIndex)o.geometry.setIndex(on?o.userData.outsideIndex:o.userData.originalIndex)});}
async function loadLevel(level){if(loaded[level])return;status.textContent=`LOD${level} wird geladen …`;if(level===1){const g=prepare((await loader.loadAsync('./lod1/neusatz_master.glb')).scene,true);groups[1].add(g);backgroundBuildingMask(g);}else if(level===2){groups[2].add(prepare((await loader.loadAsync('./lod2/neusatz_web.glb')).scene));}else{await loadLevel(1);let done=0;for(const t of manifest.tiles){groups[0].add(addSkirts(prepare((await loader.loadAsync('./'+t.url)).scene)));status.textContent=`Hero-Kachel ${++done}/16 geladen`;await new Promise(r=>setTimeout(r,0));}groups[0].add(prepare((await loader.loadAsync('./'+manifest.buildings)).scene));}loaded[level]=true;}
async function setLOD(n){ready=false;await loadLevel(n);mode=n;groups[0].visible=n===0;groups[1].visible=n<=1;groups[2].visible=n===2;heroActive.value=n===0?1:0;maskBuildings(n===0);document.querySelector('#lod').value=String(n);ready=true;draw();status.textContent=`LOD${n} bereit · ${renderer.info.render.triangles.toLocaleString('de-DE')} Dreiecke · ${manifest.building_bounds.length} Hero-Gebäude · 1 m / 20 cm`;window.testState={ready:true,lod:n,triangles:renderer.info.render.triangles,maxTextureSize:renderer.capabilities.maxTextureSize};}
const cameras={overview:{position:[1250,1550,1750],target:[0,320,-200]},approach:{position:[-380,375,650],target:[0,315,-170]},village:{position:[95,313,-220],target:[-40,298,-170]},seam:{position:[-1120,610,970],target:[-960,320,750]}};
function setCamera(name){const v=cameras[name];camera.position.fromArray(v.position);controls.target.fromArray(v.target);controls.update();draw();window.currentCamera=name;}
window.setLOD=setLOD;window.setCamera=setCamera;window.capture=()=>{draw();return renderer.domElement.toDataURL('image/png')};window.sceneInfo=()=>{const out=[];scene.traverse(o=>{if(o.isMesh&&o.name==='terrain')out.push({bounds:new THREE.Box3().setFromObject(o).min.toArray(),vertices:o.geometry.attributes.position.count})});return out};
document.querySelector('#lod').onchange=async e=>{try{await setLOD(Number(e.target.value))}catch(err){status.textContent=err.message;console.error(err)}};document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>setCamera(b.dataset.camera));document.querySelector('#wire').onchange=e=>{terrainMaterials.forEach(m=>m.wireframe=e.target.checked);draw()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw()});
setCamera(new URLSearchParams(location.search).get('camera')||'overview');try{await setLOD(Number(new URLSearchParams(location.search).get('lod')||0))}catch(err){status.textContent='Ladefehler: '+err.message;console.error(err);window.testState={ready:false,error:err.message}}
</script></html>
